# Bird EDH Deck
# Real MTG cards re-skinned with real bird species, bird facts, and bird art.
#
# Pipeline:
#   1. Fetch real card stats from Scryfall
#   2. Suggest a real bird name (human approves or vetoes)
#   3. Generate flavor text as bird factoids (pick 1 of 4)
#   4. Generate card art depicting the bird

name: "Bird EDH Deck"
version: "1.0"
description: |
  Takes a list of real Magic: The Gathering card names and re-skins each one:
    - Card name → a real bird species
    - Card art → AI-generated bird artwork
    - Flavor text → a real factoid about that bird
  
  The original card's stats (mana cost, type, abilities) stay unchanged.

# =============================================================================
# Type Definitions
# =============================================================================

types:
  BirdCard:
    id: text
    name: text                    # Original MTG card name (e.g., "Birds of Paradise")

# =============================================================================
# Context
# =============================================================================

context:
  deck_name: "Aviary of the Ancients"
  format: "EDH / Commander"
  art_style: |
    Wildlife photography style. Natural lighting, shallow depth of field,
    the bird in its natural habitat. Rich colors, sharp detail on plumage.
    No text, no frames, no watermarks.

# =============================================================================
# Assets
# =============================================================================

assets:
  type: BirdCard
  from_file: cards.txt

# =============================================================================
# Output
# =============================================================================

output:
  directory: output/
  flatten: true
  copy: true

# =============================================================================
# Steps
# =============================================================================

steps:

  # ---------------------------------------------------------------------------
  # Phase 1: Fetch real card data from Scryfall
  # ---------------------------------------------------------------------------

  - id: fetch_card_stats
    type: script
    for_each: asset
    output: card_stats
    config:
      command: "python3 scripts/scryfall_lookup.py"
      input: json
      output_format: json
      timeout: 10

  # ---------------------------------------------------------------------------
  # Phase 2: Suggest a real bird species name
  # ---------------------------------------------------------------------------

  - id: suggest_bird_name
    type: generate_text
    for_each: asset
    requires: [fetch_card_stats]
    output: bird_name
    until: "approved"
    max_attempts: 5
    config:
      response_format: json
      prompt: |
        You are helping re-skin a Magic: The Gathering card as a bird-themed card.

        Original card: {asset.name}
        Mana cost: {fetch_card_stats.mana_cost}
        Type: {fetch_card_stats.type_line}
        Abilities: {fetch_card_stats.oracle_text}
        Colors: {fetch_card_stats.colors}

        Suggest a REAL bird species whose characteristics match the flavor and
        mechanics of this card. The bird must be a real species — no made-up names.

        Respond with a JSON object:
        {
          "bird": "<full common name of the bird>",
          "rationale": "<2-3 sentences explaining why this bird fits the card>"
        }

  # ---------------------------------------------------------------------------
  # Phase 3: Research the bird, then generate flavor text
  # ---------------------------------------------------------------------------

  - id: research_bird
    type: research
    for_each: asset
    requires: [suggest_bird_name]
    provider: perplexity
    config:
      query: |
        {suggest_bird_name.bird} bird species:
        - Habitat, range, and migration patterns
        - Distinctive behaviors or hunting techniques
        - Unique physical characteristics (plumage, size, calls)
        - Interesting or surprising facts
        - Conservation status

  - id: generate_flavor_text
    type: generate_text
    for_each: asset
    requires: [research_bird]
    variations: 4
    select: "user"
    config:
      response_format: json
      variation_key: content
      prompt: |
        You are writing flavor text for a Magic: The Gathering card that has been
        re-skinned as a real bird species.

        # Card Info

        Original card: {asset.name}
        Mana cost: {fetch_card_stats.mana_cost}
        Type: {fetch_card_stats.type_line}
        Abilities: {fetch_card_stats.oracle_text}
        Colors: {fetch_card_stats.colors}

        # Bird Info

        Bird: {suggest_bird_name.bird}
        Why this bird fits the card: {suggest_bird_name.rationale}
        Research: {research_bird.content}

        # Writing Craft

        Great flavor text makes the reader stop and re-read it. Here's what
        separates great flavor text from mediocre:

        **Write complete sentences.** Every draft must have a subject and a
        verb. "It hunts in silence" is a sentence. "Silent hunter of the deep"
        is not. Fragments are lazy — earn your brevity with precise, complete
        thoughts.

        **Be concrete and specific.** Don't say "swift." Say "240 miles per
        hour." Don't say "haunting call." Describe what the call actually sounds
        like. The best flavor text teaches you something real and surprising.

        **Avoid these cliches:**
        - Sentence fragments posing as profundity ("Wings of shadow. Eyes of
          flame.")
        - Generic mysticism ("ancient," "whispered," "darkness," "silence")
        - Telling instead of showing ("a fearsome predator," "a beautiful song")
        - Pseudo-poetic inversions ("Swift is the falcon, deadly its aim")

        **Write like a fascinated naturalist, not a fantasy narrator.** Think
        David Attenborough meets Ursula K. Le Guin — grounded in real
        observation but alive with wonder. Field journal, not prophecy.

        # Examples of the quality we're after

        Good: "The Clark's nutcracker buries 30,000 seeds each autumn and
        remembers where it put every single one."
        Good: "A peregrine falcon closes its third eyelid at 240 mph. It
        learned to blink faster than anything alive."
        Good: "Corvids hold funerals. When one dies, the others gather and
        study the body in silence."
        Bad: "Swift wings cut through the endless sky." (fragment, vague)
        Bad: "Nature's perfect predator." (fragment, tells not shows)
        Bad: "In the silence between wingbeats, death arrives." (purple prose)

        # Brainstorm

        Choose 3 of these writing prompts and draft a flavor text (1-2
        complete sentences) for each one:
        * A surprising or little-known fact about this bird's behavior
        * A vivid, specific detail about the bird's appearance or plumage
        * A fact about the bird's call, song, or how it sounds
        * Something about this bird's hunting technique or diet
        * A migration, habitat, or survival fact
        * A cultural, mythological, or historical reference about the bird
        * A fact that mirrors the card's mechanics (e.g., a bird that hoards
          food for a card about resource accumulation)
        * Something about how this bird interacts with other species

        Each draft must be factually accurate and written in complete sentences.

        # Final Selection

        Review your 3 drafts. Choose the one that:
        - Would make a reader say "wait, really?" or "I didn't know that"
        - Best captures both the bird's nature and the card's identity
        - Reads as a complete, well-crafted sentence — not a fragment

        Polish it. Read it aloud in your head. Cut any word that doesn't earn
        its place.

        Respond with JSON:
        {
          "brainstorm": [
            {"prompt": "<which writing prompt>", "draft": "..."},
            {"prompt": "<which writing prompt>", "draft": "..."},
            {"prompt": "<which writing prompt>", "draft": "..."}
          ],
          "chosen": "<which draft you picked and one sentence on why>",
          "content": "<your final polished flavor text>"
        }

  # ---------------------------------------------------------------------------
  # Phase 4: Generate card art
  # ---------------------------------------------------------------------------

  - id: card_art
    type: image_search
    for_each: asset
    requires: [suggest_bird_name]
    config:
      query: "{suggest_bird_name.bird}"
      count: 3
      aspect_ratio: landscape
      style: "wildlife photography"
      image_type: photo
      safe_search: moderate

  # ---------------------------------------------------------------------------
  # Phase 5: Render full cards via Magic Set Editor
  # ---------------------------------------------------------------------------

  - id: render_full_cards
    type: render_mse_cards
    requires: [card_art, generate_flavor_text, suggest_bird_name]
    is_output: true
    config:
      set_name: aviary_of_the_ancients
      stylesheet: m15-altered
      name_field: bird_name.bird
      stats_field: card_stats
      flavor_text_step: generate_flavor_text
      art_step: card_art

  # ---------------------------------------------------------------------------
  # Phase 6: Done
  # ---------------------------------------------------------------------------

  - id: finish
    type: fin
    requires: [render_full_cards]
    config:
      title: "Aviary of the Ancients – Complete!"
      message: "Your bird-themed MTG cards have been rendered."
      display:
        - step: render_full_cards
          type: images
          label: "Rendered Cards"
        - step: card_art
          type: images
          label: "Bird Art"
        - step: generate_flavor_text
          type: text
          label: "Flavor Text"
